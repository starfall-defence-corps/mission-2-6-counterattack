all:
  vars:
    ansible_user: cadet
    ansible_ssh_private_key_file: ../../.docker/ssh-keys/cadet_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  children:
    fleet:
      hosts:
        sdc-app:
          ansible_host: localhost
          ansible_port: 2221
        sdc-web:
          ansible_host: localhost
          ansible_port: 2222
        sdc-db:
          ansible_host: localhost
          ansible_port: 2223

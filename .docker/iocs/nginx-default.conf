server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Content-Type text/plain;
        return 200 "Starfall Defence Corps - Fleet Node\n";
    }
}
